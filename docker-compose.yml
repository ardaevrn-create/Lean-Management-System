# Tek komutla çalıştırma: docker compose up -d --build   →   http://localhost:3000
# Giriş: şirket DEMO, kullanıcı admin, şifre admin123
# Port değiştirmek için .env dosyası (kökte) veya ortam değişkeni: WEB_PORT, API_PORT, DB_PORT
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: lean
      POSTGRES_PASSWORD: lean
      POSTGRES_DB: lean
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Geliştirici erişimi için 5433 (bilgisayarınızdaki Postgres ile çakışmasın diye).
    ports:
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lean -d lean"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://lean:lean@db:5432/lean?schema=public
      # Gerçek bir sunucuda mutlaka değiştirin (kökteki .env içinde JWT_SECRET=...).
      JWT_SECRET: ${JWT_SECRET:-yerel-kurulum-icin-degistirin-0123456789}
      WEB_ORIGIN: http://localhost:${WEB_PORT:-3000}
      SEED_DEMO: "true"
      STORAGE_DRIVER: disk
      UPLOAD_DIR: /data/uploads
      PORT: "4000"
    volumes:
      - uploads:/data/uploads
    # Swagger: http://localhost:4000/api/docs
    ports:
      - "${API_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_ORIGIN: http://api:4000
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_ORIGIN: http://api:4000
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  pgdata:
  uploads:
