name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lean
          POSTGRES_PASSWORD: lean
          POSTGRES_DB: lean_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://lean:lean@localhost:5432/lean_test?schema=public
      TEST_DATABASE_URL: postgresql://lean:lean@localhost:5432/lean_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lean/shared build
      - run: pnpm --filter @lean/api exec prisma generate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm --filter @lean/api test
      - run: pnpm --filter @lean/api test:e2e
      - run: pnpm --filter @lean/api build
      - run: pnpm --filter @lean/web build
